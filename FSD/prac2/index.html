<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Registration Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="form-card" aria-labelledby="form-title">
      <header class="form-header">
        <p class="eyebrow">Student portal</p>
        <h1 id="form-title">Course Registration</h1>
        <p>Complete the form below to register for your preferred course.</p>
      </header>

      <form action="#" method="post">
        <div class="form-grid">
          <div class="field">
            <label for="full-name">Full name <span aria-hidden="true">*</span></label>
            <input type="text" id="full-name" name="full-name" placeholder="Enter your full name" required>
          </div>

          <div class="field">
            <label for="email">Email address <span aria-hidden="true">*</span></label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required>
          </div>

          <div class="field">
            <label for="phone">Phone number</label>
            <input type="tel" id="phone" name="phone" placeholder="+91 98765 43210">
          </div>

          <div class="field">
            <label for="birth-date">Date of birth</label>
            <input type="date" id="birth-date" name="birth-date">
          </div>

          <div class="field">
            <label for="course">Select a course <span aria-hidden="true">*</span></label>
            <select id="course" name="course" required>
              <option value="" selected disabled>Choose a course</option>
              <option value="web-development">Web Development</option>
              <option value="data-science">Data Science</option>
              <option value="cyber-security">Cyber Security</option>
            </select>
          </div>

          <div class="field">
            <label for="experience">Experience level</label>
            <select id="experience" name="experience">
              <option value="beginner">Beginner</option>
              <option value="intermediate">Intermediate</option>
              <option value="advanced">Advanced</option>
            </select>
          </div>
        </div>

        <fieldset>
          <legend>Preferred learning mode</legend>
          <div class="choice-group">
            <label class="choice">
              <input type="radio" name="learning-mode" value="classroom" checked>
              <span>Classroom</span>
            </label>
            <label class="choice">
              <input type="radio" name="learning-mode" value="online">
              <span>Online</span>
            </label>
            <label class="choice">
              <input type="radio" name="learning-mode" value="hybrid">
              <span>Hybrid</span>
            </label>
          </div>
        </fieldset>

        <div class="field">
          <label for="message">Why do you want to join?</label>
          <textarea id="message" name="message" rows="4" placeholder="Tell us a little about your goals..."></textarea>
        </div>

        <label class="terms">
          <input type="checkbox" name="terms" required>
          <span>I agree to the terms and conditions.</span>
        </label>

        <button type="submit">Submit registration</button>
      </form>
    </section>
  </main>
</body>
</html>
